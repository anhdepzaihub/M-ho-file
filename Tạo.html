<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mã xác nhận trực tuyến</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .card {
    background: #fff;
    padding: 40px 32px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    text-align: center;
    width: 340px;
  }
  h1 { font-size: 20px; color: #333; margin-bottom: 6px; }
  p.sub { font-size: 13px; color: #888; margin-bottom: 24px; }
  .code {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 10px;
    color: #4b3faf;
    background: #f3f1ff;
    padding: 14px 0 14px 10px;
    border-radius: 12px;
    user-select: all;
    margin-bottom: 10px;
  }
  .timer {
    font-size: 13px;
    color: #e05a00;
    height: 18px;
    margin-bottom: 20px;
  }
  .timer.expired { color: #d32f2f; font-weight: 600; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: opacity .2s;
  }
  button:hover { opacity: .9; }
  button.copy { background: #eee; color: #333; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="card">
  <h1>🔐 Mã xác nhận</h1>
  <p class="sub">Nhấn nút để tạo mã mới (hiệu lực 60 giây)</p>

  <div class="code" id="code">------</div>
  <div class="timer" id="timer"></div>

  <button id="genBtn">Tạo mã mới</button>
  <button class="copy" id="copyBtn">📋 Sao chép mã</button>
</div>

<script>
let currentCode = "";
let timeLeft = 0;
let intervalId = null;

const codeEl  = document.getElementById("code");
const timerEl = document.getElementById("timer");
const genBtn  = document.getElementById("genBtn");
const copyBtn = document.getElementById("copyBtn");

// Sinh mã OTP 6 chữ số bằng crypto (an toàn hơn Math.random)
function generateCode(length = 6) {
  const arr = new Uint32Array(length);
  crypto.getRandomValues(arr);
  return Array.from(arr, n => (n % 10).toString()).join("");
}

function startTimer(seconds) {
  clearInterval(intervalId);
  timeLeft = seconds;
  updateTimer();
  intervalId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(intervalId);
      currentCode = "";
      codeEl.textContent = "------";
      copyBtn.disabled = true;
      timerEl.textContent = "❌ Mã đã hết hạn, vui lòng tạo mã mới";
      timerEl.classList.add("expired");
    }
  }, 1000);
}

function updateTimer() {
  timerEl.classList.remove("expired");
  timerEl.textContent = `⏳ Hết hạn sau: ${timeLeft}s`;
}

function newCode() {
  currentCode = generateCode(6);
  codeEl.textContent = currentCode;
  copyBtn.disabled = false;
  startTimer(60);
}

genBtn.addEventListener("click", newCode);

copyBtn.addEventListener("click", async () => {
  if (!currentCode) return;
  try {
    await navigator.clipboard.writeText(currentCode);
    copyBtn.textContent = "✅ Đã sao chép!";
    setTimeout(() => copyBtn.textContent = "📋 Sao chép mã", 1500);
  } catch {
    alert("Mã của bạn: " + currentCode);
  }
});

// Tạo mã sẵn khi mở trang
newCode();
</script>

</body>
